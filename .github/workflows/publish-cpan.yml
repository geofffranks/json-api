name: Publish to CPAN

on:
  workflow_run:
    workflows: [finalize-release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish to CPAN"
        required: true
        type: string

concurrency:
  group: publish-cpan-${{ inputs.tag || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to CPAN
    runs-on: ubuntu-latest
    environment: Release
    if: |
      github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Resolve tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [ -n "$INPUT_TAG" ] || { echo "publish-cpan: empty input tag" >&2; exit 1; }
          echo "TAG=$INPUT_TAG" >> "$GITHUB_ENV"

      - name: Download release-tag artifact (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: release-tag
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/release-tag

      - name: Resolve tag (workflow_run)
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          TAG=$(tr -d '[:space:]' < "$RUNNER_TEMP/release-tag/tag.txt")
          [ -n "$TAG" ] || { echo "publish-cpan: empty tag artifact" >&2; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: update-version
        # Accepts both old v-string form ($VERSION = v1.2.0;) and new
        # quoted form ($VERSION = '1.2.0';) on the input side.
        # Always emits the quoted form. Tag is expected as bare X.Y.Z
        # (no 'v' prefix); old v-prefixed tags are still acceptable for
        # backwards compatibility — the leading 'v' is stripped.
        env:
          REF_NAME: ${{ env.TAG }}
        run: |
          REF_NAME_BARE="${REF_NAME#v}"
          perl -i -pe "s/^(\\s*)\\\$VERSION\\s*=\\s*['\"]?v?[0-9.]+['\"]?;/\$1\\\$VERSION = '${REF_NAME_BARE}';/" lib/JSON/API.pm
          if ! grep -qF "\$VERSION = '${REF_NAME_BARE}';" lib/JSON/API.pm; then
              echo "publish-cpan: failed to update \$VERSION in lib/JSON/API.pm" >&2
              exit 1
          fi

      - name: install cpanm and multiple modules
        uses: perl-actions/install-with-cpanm@v2
        with:
          install: |
            Module::Build
            Software::License
            JSON
            LWP::UserAgent
            URI::Encode
            Test::Fake::HTTPD
            IO::Capture
            Test::More
            Test::Pod::Coverage
            CPAN::Uploader

      - name: Configure
        run: perl Build.PL
      - name: Test
        run: ./Build test
      - name: Build
        run: ./Build
      - name: Build Manifest
        run: ./Build manifest
      - name: Deliver locally
        run: ./Build dist
      - name: Upload to CPAN
        env:
          CPAN_USERNAME: ${{ secrets.USERNAME }}
          CPAN_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          umask 077
          trap 'rm -f ~/.pause' EXIT
          printf 'user %s\npassword %s\n' "$CPAN_USERNAME" "$CPAN_PASSWORD" > ~/.pause
          cpan-upload JSON-API-*.tar.gz
